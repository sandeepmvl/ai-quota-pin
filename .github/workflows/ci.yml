name: ci
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix: { os: [macos-latest, windows-latest, ubuntu-22.04] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxss-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: cd src-tauri && cargo check --locked
